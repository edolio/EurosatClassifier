name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install exact versions from uv.lock
        run: uv sync --locked
      - name: Smoke test (app starts, models load, a fake image is classified)
        run: uv run smoke_test.py
